name: SAP2000 engineering geometry fixture
on:
  push:
    branches: [gpt2/sap2000-engineering-geometry]
  pull_request:
    paths:
      - 'src/linkoteq_importer/sap2000_geometry.py'
      - 'src/linkoteq_importer/sap2000_properties.py'
      - 'src/linkoteq_importer/sap2000_boundary.py'
      - 'src/linkoteq_importer/sap2000_loads.py'
      - 'scripts/test_sap2000_boundary_load_fixture.py'
      - 'scripts/test_sap2000_properties_fixture.py'
      - 'scripts/test_sap2000_geometry_fixture.py'
      - 'docs/MTDENN~1.$2k'
      - '.github/workflows/sap2000-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run real SAP2000 geometry extraction
        run: PYTHONPATH=src python scripts/test_sap2000_geometry_fixture.py
      - name: Run real SAP2000 material and section extraction
        run: PYTHONPATH=src python scripts/test_sap2000_properties_fixture.py
      - name: Run real SAP2000 boundary and load extraction
        run: PYTHONPATH=src python scripts/test_sap2000_boundary_load_fixture.py
